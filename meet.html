<html lang="ar" dir="rtl">
<head>

<style>
  :root{color-scheme:dark;--bg:#0f1114;--card:#171a1f;--line:rgba(255,255,255,.1);--ink:#fff;--ink2:rgba(255,255,255,.66);--acc:#0a84ff;--red:#ff3b30}

  .gp{min-height:100%;display:flex;flex-direction:column;align-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
  .gtop{width:100%;max-width:980px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
  .gbrand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:.3px}.gbrand i{width:34px;height:34px;border-radius:10px;background:#fff;color:#0f1114;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:15px}
  .glang{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:7px 14px;font-size:13px;cursor:pointer}

<script src="/vendor/supabase.js"></script>
<script>
/* MEET-CORE-START */
/* =====================================================================
   v7.48 (note 10) — NFMeetCore: the meeting engine + the meeting window, shared by the app (part 99zzZzZZzk-meet.js) and the
   guest page (meet.html, built by tools/mkmeet.py from the text between the MEET-CORE markers). No words here: every page
   passes its own labels (T) — the app through L(), the guest page through its own two-language table.
   · signalling + who is in: the realtime channel «meet:<room>» of the meeting's own system (presence = people, broadcast =
     offers / answers / ICE addressed to one peer, chat, host commands);
   · passes: every device makes its own signing key (private part never leaves the browser). The pass = the server's ECDSA
     P-256 signature over «room|id|key fingerprint» (Edge function «meet»: «mysig» for colleagues who can read the meeting,
     «admit» when the host lets someone in). Everybody checks everybody's pass with the room's public key, and every
     broadcast is signed with the sender's own key — so a pass seen in the room cannot be reused by somebody else, host
     commands cannot be forged and the waiting room cannot be skipped. Guests prove their key to the server on each call;
   · media: device to device (mesh, up to 6 cameras) — or, when the owner set the Cloudflare Realtime keys, through the
     Cloudflare SFU (one connection per person, the server forwards the tracks), for bigger meetings and weak networks;
   · recording (only after the host turns it on, and everybody sees it): each device cuts its own microphone into spoken
     sentences (voice detection, 0.4 s before the first word is kept), 16 kHz WAV, and sends each to «meet/chunk», which writes
     the text under the speaker's name — so the transcript knows who said what. A muted microphone sends nothing.
   ===================================================================== */
(function () {
  if (window.NFMeetCore) return;
  const FN = 'https://erhcnkjyaumdoixkksbz.supabase.co/functions/v1/meet';
  const MAXV = 6; const TS_WIN = 120000;
  const enc = s => new TextEncoder().encode(s);
  const b64u = s => Uint8Array.from(atob(String(s).replace(/-/g, '+').replace(/_/g, '/').padEnd(Math.ceil(String(s).length / 4) * 4, '=')), c => c.charCodeAt(0));
  const b64uE = u8 => { let s = ''; for (let i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
  const rid = n => { const a = new Uint8Array(n || 12); crypto.getRandomValues(a); return Array.from(a, b => 'abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'[b % 57]).join(''); };
  const ES = { name: 'ECDSA', namedCurve: 'P-256' }, EH = { name: 'ECDSA', hash: 'SHA-256' };
  const keyCache = new Map(); const okCache = new Map();
  async function keyOf(j) { const kk = j.x + '.' + j.y; let k = keyCache.get(kk); if (!k) { k = await crypto.subtle.importKey('jwk', { kty: 'EC', crv: 'P-256', x: j.x, y: j.y, ext: true }, ES, false, ['verify']); keyCache.set(kk, k); } return k; }
  async function vsig(j, msg, sig) { try { if (!j || !j.x || !j.y || !sig) return false; return await crypto.subtle.verify(EH, await keyOf(j), b64u(sig), enc(msg)); } catch (e) { return false; } }
  const thumb = async j => b64uE(new Uint8Array(await crypto.subtle.digest('SHA-256', enc(j.x + '.' + j.y))));
  /* a pass: the room key's signature over «room|id|fingerprint of that person's own key» */
  async function passOk(pub, room, id, eph, sig) {
    if (!pub || !id || !sig || !eph || !eph.x) return false; const ck = room + '|' + id + '|' + eph.x + eph.y + '|' + sig; if (okCache.has(ck)) return okCache.get(ck);
    const ok = await vsig(pub, room + '|' + id + '|' + await thumb(eph), sig); okCache.set(ck, ok); return ok;
  }
  /* this device's own signing key (the private part cannot be exported) */
  async function eph() {
    const kp = await crypto.subtle.generateKey(ES, false, ['sign', 'verify']); const j = await crypto.subtle.exportKey('jwk', kp.publicKey); const pub = { x: j.x, y: j.y };
    return { pub, thumb: await thumb(pub), sign: async m => b64uE(new Uint8Array(await crypto.subtle.sign(EH, kp.privateKey, enc(m)))) };
  }
  /* the Edge function «meet»: token = the person's own sign-in token (colleagues); guests send their pass + a fresh proof */
  async function call(action, body, token) {
    const r = await fetch(FN, { method: 'POST', headers: Object.assign({ 'content-type': 'application/json' }, token ? { Authorization: 'Bearer ' + token } : {}), body: JSON.stringify(Object.assign({ action }, body || {})) });
    const j = await r.json().catch(() => ({})); if (!r.ok && !j.error) j.error = 'http ' + r.status; return j;
  }
  /* 16 kHz mono 16-bit WAV */
  function wav(samples, rate) {
    const n = samples.length; const buf = new ArrayBuffer(44 + n * 2); const v = new DataView(buf); const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVE'); w(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n * 2, true);
    for (let i = 0; i < n; i++) { const s = Math.max(-1, Math.min(1, samples[i])); v.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true); }
    return new Uint8Array(buf);
  }
  const toB64 = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };

  function create(o) {
    /* o: { sb, room, me: {id, name, guest, wid}, eph (from eph()), sig, host, pubKey, hostId, token() → Promise<string>, sfu, video, rec, onUpdate, onChat, onEvent } */
    const st = { joined: false, admitted: !!o.sig, peers: new Map(), waiting: [], local: null, mic: true, cam: !!o.video, screen: null, hand: false, chat: [], rec: false, speaking: '', ended: false, mode: o.sfu ? 'sfu' : 'mesh', err: '', ice: null, recBusy: 0, recSent: 0, host: !!o.host };
    let ch = null, raf = 0; const pcs = new Map(); const pending = new Map();
    const upd = () => { if (raf) return; raf = requestAnimationFrame(() => { raf = 0; try { o.onUpdate && o.onUpdate(st); } catch (e) { console.warn(e); } }); };
    const ev = (k, d) => { try { o.onEvent && o.onEvent(k, d); } catch (e) { console.warn(e); } };
    const auth = async () => (o.token ? await o.token() : '') || '';
    const fn = async (action, body) => {
      let g = {}; if (o.me.guest) { const ts = Date.now(); g = { gid: o.me.id, sig: o.sig || '', eph: o.eph.pub, ts, proof: await o.eph.sign(o.room + '|' + o.me.id + '|' + ts) }; }
      return call(action, Object.assign({ room: o.room }, g, body || {}), o.me.guest ? '' : await auth());
    };
    const myState = () => ({ name: o.me.name, guest: !!o.me.guest, wid: o.me.wid || '', sig: o.sig || '', eph: o.eph.pub, wait: !st.admitted, hand: st.hand, mic: st.mic, cam: st.cam && !!(st.local && st.local.getVideoTracks().length), screen: !!st.screen, sfu: st.sfu || null, at: st.joinedAt || Date.now() });
    const track = () => { if (ch) try { ch.track(myState()); } catch (e) { /* offline */ } upd(); };
    /* every broadcast is signed with my own key: payload = { from, ts, d: JSON text, s } (one queue keeps the order) */
    let sendQ = Promise.resolve();
    const send = (event, payload) => { sendQ = sendQ.then(async () => { if (!ch) return; const d = JSON.stringify(payload || {}); const ts = Date.now(); const s = await o.eph.sign(event + '|' + o.me.id + '|' + ts + '|' + d); try { ch.send({ type: 'broadcast', event, payload: { from: o.me.id, ts, d, s } }); } catch (e) { /* offline */ } }).catch(() => {}); return sendQ; };
    async function open(event, pl) {
      if (!pl || !pl.from || typeof pl.d !== 'string' || Math.abs(Date.now() - (+pl.ts || 0)) > TS_WIN) return null; const p = st.peers.get(pl.from); if (!p || !p.eph) return null;
      if (!(await vsig(p.eph, event + '|' + pl.from + '|' + pl.ts + '|' + pl.d, pl.s))) return null;
      try { return Object.assign(JSON.parse(pl.d), { from: pl.from }); } catch (e) { return null; }
    }

    /* ---------- local media ---------- */
    async function media(video) {
      const a = { echoCancellation: true, noiseSuppression: true, autoGainControl: true };
      try { return await navigator.mediaDevices.getUserMedia({ audio: a, video: video ? { width: { ideal: 960 }, height: { ideal: 540 }, frameRate: { ideal: 24 } } : false }); }
      catch (e) { if (video) return media(false); throw e; }
    }
    const vTrack = () => (st.screen ? st.screen.getVideoTracks()[0] : (st.local && st.local.getVideoTracks()[0])) || null;
    const aTrack = () => (st.local && st.local.getAudioTracks()[0]) || null;

    /* ---------- who is in (presence); one check at a time ---------- */
    let syncQ = Promise.resolve();
    const sync = () => { syncQ = syncQ.then(syncNow).catch(e => console.warn('meet sync', e)); return syncQ; };
    async function syncNow() {
      if (!ch) return; const ps = ch.presenceState(); const seen = new Set(); const waiting = [];
      for (const id of Object.keys(ps)) {
        if (id === o.me.id) continue; const metas = ps[id] || []; let m = null;
        for (const x of metas) { if (x && x.sig && !x.wait && await passOk(o.pubKey, o.room, id, x.eph, x.sig)) { m = x; break; } }
        if (!m) { const w = metas.find(x => x && x.wait && x.eph && x.eph.x); if (w) waiting.push({ id, name: String(w.name || '').slice(0, 40), guest: !!w.guest, at: w.at || 0, eph: w.eph }); if (st.peers.has(id)) drop(id); continue; }
        seen.add(id); let p = st.peers.get(id);
        if (p && p.eph && (p.eph.x !== m.eph.x || p.eph.y !== m.eph.y)) { drop(id); p = null; }
        p = p || { id, stream: new MediaStream(), level: 0 };
        Object.assign(p, { name: String(m.name || '').slice(0, 40), guest: !!m.guest, wid: m.guest ? '' : String(m.wid || '').slice(0, 60), host: id === o.hostId, hand: !!m.hand, mic: m.mic !== false, cam: !!m.cam, screen: !!m.screen, sfu: m.sfu || null, at: m.at || 0, eph: m.eph, sig: m.sig });
        st.peers.set(id, p);
        if (st.admitted) { if (st.mode === 'mesh') { if (!pcs.has(id) && o.me.id < id) offer(id); else flushPending(id); } else sfuPull(p); }
      }
      [...st.peers.keys()].forEach(id => { if (!seen.has(id)) drop(id); });
      st.waiting = waiting.sort((a, b) => a.at - b.at); st.hostHere = !!o.host || [...st.peers.values()].some(p => p.host);
      upd();
    }
    function drop(id) { const pc = pcs.get(id); if (pc) { try { pc.close(); } catch (e) { /* closed */ } pcs.delete(id); } const p = st.peers.get(id); if (p && st.mode === 'sfu' && p.mids) sfuClose(p.mids); st.peers.delete(id); pending.delete(id); upd(); }

    /* ---------- mesh: one connection per pair, the smaller id offers ---------- */
    /* the offering side adds an audio + a video line; the answering side fills the lines the offer brought (never adds its own) */
    function pcFor(id, offering) {
      let pc = pcs.get(id); if (pc) return pc;
      pc = new RTCPeerConnection({ iceServers: st.ice || [{ urls: 'stun:stun.cloudflare.com:3478' }] }); pcs.set(id, pc);
      if (offering) {
        const a = aTrack(); pc.addTransceiver(a || 'audio', { direction: 'sendrecv', streams: st.local ? [st.local] : [] });
        const v = st.peers.size <= MAXV ? vTrack() : null; pc._v = pc.addTransceiver(v || 'video', { direction: 'sendrecv', streams: st.local ? [st.local] : [] }).sender;
      }
      /* the address list travels inside the offer / answer (few messages — the realtime server limits them); only late ones go alone */
      pc.onicecandidate = e => { if (e.candidate && pc._sent) send('sig', { to: id, kind: 'ice', data: e.candidate.toJSON ? e.candidate.toJSON() : e.candidate }); };
      pc.ontrack = e => { const p = st.peers.get(id); if (!p) return; if (!p.stream.getTracks().includes(e.track)) p.stream.addTrack(e.track); e.track.onunmute = upd; meter(p); upd(); };
      pc.onconnectionstatechange = () => { const s2 = pc.connectionState; const p = st.peers.get(id); if (p) p.net = s2; if (s2 === 'failed' && o.me.id < id) { try { pc.restartIce(); } catch (e) { /* old browser */ } offer(id, true); } upd(); };
      return pc;
    }
    const gathered = pc => new Promise(res => {
      if (pc.iceGatheringState === 'complete') return res(); const ms = (st.ice || []).some(s => /turns?:/.test(String(s.urls))) ? 3500 : 2000;
      const done = () => { clearTimeout(t); pc.removeEventListener('icegatheringstatechange', chk); res(); }; const chk = () => { if (pc.iceGatheringState === 'complete') done(); };
      const t = setTimeout(done, ms); pc.addEventListener('icegatheringstatechange', chk);
    });
    async function offer(id, restart) {
      const pc = pcFor(id, true); try { pc._sent = false; const of = await pc.createOffer(restart ? { iceRestart: true } : undefined); await pc.setLocalDescription(of); await gathered(pc); const d = pc.localDescription; pc._sent = true; send('sig', { to: id, kind: 'offer', data: { type: d.type, sdp: d.sdp } }); } catch (e) { st.err = String(e && e.message || e); upd(); }
    }
    async function onSig(pl) {
      if (!pl || !pl.from) return; if (!st.admitted || !st.peers.has(pl.from)) { const q = pending.get(pl.from) || []; q.push(pl); pending.set(pl.from, q.slice(-80)); return; }
      const m = await open('sig', pl); if (!m || m.to !== o.me.id) return; const id = m.from; const pc = pcFor(id, false);
      try {
        if (m.kind === 'offer') {
          await pc.setRemoteDescription(m.data);
          pc.getTransceivers().forEach(t => { const k = t.receiver && t.receiver.track && t.receiver.track.kind; if (!k || t.currentDirection === 'stopped') return; if (k === 'audio' && !t.sender.track && aTrack()) t.sender.replaceTrack(aTrack()).catch(() => {}); if (k === 'video') { if (!pc._v) pc._v = t.sender; if (!t.sender.track && st.peers.size <= MAXV && vTrack()) t.sender.replaceTrack(vTrack()).catch(() => {}); } try { t.direction = 'sendrecv'; } catch (e) { /* fixed */ } });
          pc._sent = false; const an = await pc.createAnswer(); await pc.setLocalDescription(an); await gathered(pc); const d = pc.localDescription; pc._sent = true; send('sig', { to: id, kind: 'answer', data: { type: d.type, sdp: d.sdp } });
        }
        else if (m.kind === 'answer') { if (pc.signalingState === 'have-local-offer') await pc.setRemoteDescription(m.data); }
        else if (m.kind === 'ice' && m.data) { await pc.addIceCandidate(m.data).catch(() => {}); }
      } catch (e) { st.err = String(e && e.message || e); upd(); }
    }
    async function flushPending(id) { const q = pending.get(id); if (!q) return; pending.delete(id); for (const pl of q) await onSig(pl); }

    /* ---------- SFU (Cloudflare Realtime): push my tracks once, pull everybody else's ---------- */
    let spc = null; let sq = Promise.resolve(); const midOwner = new Map();
    const queue = f => (sq = sq.then(f).catch(e => { st.err = String(e && e.message || e); upd(); }));
    async function sfuOpen() {
